<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 240 240" role="img" aria-labelledby="title description">
  <title id="title">OScore retro digital home screen</title>
  <desc id="description">A square retro watch display with OScore branding, battery level, large digital time, and date in warm amber-green phosphor colors.</desc>
  <defs>
    <pattern id="scanlines" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#55f4ea" opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="31" fill="#080b12"/>
  <rect x="8" y="8" width="224" height="224" rx="25" fill="#0c111b" stroke="#263342" stroke-width="1.2"/>
  <rect x="13" y="13" width="214" height="214" rx="21" fill="url(#scanlines)"/>

  <!-- Pixel-like corner brackets give the face a compact arcade HUD frame. -->
  <g fill="#34cfc8" opacity="0.8">
    <path d="M23 34h12v3H26v9h-3zM217 34h-12v3h9v9h3z"/>
    <path d="M23 206h3v-9h9v-3H23zM217 206h-3v-9h-9v-3h12z"/>
  </g>

  <g font-family="'Courier New', monospace">
    <rect x="34" y="26" width="62" height="22" rx="3" fill="#151f2b" stroke="#344553" stroke-width="1"/>
    <text x="65" y="41" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5" fill="#e6f4f5">OSCORE</text>

    <g transform="translate(165 31)" stroke="#8a9ca9" fill="none" stroke-width="1.5">
      <rect x="0" y="0" width="25" height="12" rx="2"/>
      <path d="M26 3h3v6h-3" fill="#8a9ca9" stroke="none"/>
      <rect x="3" y="3" width="15" height="6" rx="1" fill="#ffb547" stroke="none"/>
    </g>
    <text x="202" y="41" font-size="9" text-anchor="end" fill="#ffbf5a">82%</text>

    <path d="M38 68h24M38 68v9M202 68h-24M202 68v9" stroke="#263c49" stroke-width="2"/>
    <text x="120" y="83" font-size="10" text-anchor="middle" letter-spacing="2.6" fill="#91a6b2">SAT  /  14 NOV</text>
    <text x="120" y="151" font-size="49" text-anchor="middle" font-weight="bold" letter-spacing="-3" fill="#56f4e7" filter="url(#glow)">09:41</text>
    <text x="120" y="151" font-size="49" text-anchor="middle" font-weight="bold" letter-spacing="-3" fill="#56f4e7">09:41</text>

    <path d="M72 177h96" stroke="#253b48" stroke-width="1"/>
    <rect x="105" y="188" width="30" height="4" fill="#ffb547"/>
    <text x="120" y="210" font-size="10" text-anchor="middle" letter-spacing="2" fill="#879aa8">2026</text>
  </g>
</svg>
